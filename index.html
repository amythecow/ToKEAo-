<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Adults only] ToKEAo 日本之旅 (11/26 - 12/1)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js for interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-20" x-data="{ activeTab: 'itinerary', currentDay: 'all' }">

    <!-- Header Hero Section -->
    <header class="relative bg-cover bg-center h-80 flex items-center justify-center text-white text-center px-4" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1600&q=80');">
        <div>
            <span class="bg-red-600 text-xs uppercase px-3 py-1 rounded-full font-bold tracking-widest mb-2 inline-block">Japan Trip</span>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-2">[Adults only] ToKEAo</h1>
            <p class="text-slate-200 text-sm md:text-base"><i class="fa-regular fa-calendar-alt mr-1"></i> 11.26 — 12.01 (6 Days)</p>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="sticky top-0 z-50 bg-white shadow-md">
        <div class="max-w-4xl mx-auto flex justify-around border-b text-sm font-medium">
            <button @click="activeTab = 'itinerary'" :class="activeTab === 'itinerary' ? 'border-red-600 text-red-600 font-bold' : 'text-slate-500 border-transparent hover:text-slate-700'" class="py-3 px-4 border-b-2 transition flex items-center gap-1.5 flex-1 justify-center">
                <i class="fa-solid fa-route"></i> 每日行程
            </button>
            <button @click="activeTab = 'transport'" :class="activeTab === 'transport' ? 'border-red-600 text-red-600 font-bold' : 'text-slate-500 border-transparent hover:text-slate-700'" class="py-3 px-4 border-b-2 transition flex items-center gap-1.5 flex-1 justify-center">
                <i class="fa-solid fa-plane-departure"></i> 機票與交通
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6">

        <!-- 1. 每日行程 (ITINERARY) -->
        <section x-show="activeTab === 'itinerary'" class="space-y-6">
            <!-- Day Filter Pills -->
            <div class="flex overflow-x-auto gap-2 pb-2 scrollbar-none text-xs">
                <button @click="currentDay = 'all'" :class="currentDay === 'all' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border'" class="px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition">全部行程</button>
                <button @click="currentDay = 'd1'" :class="currentDay === 'd1' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border'" class="px-3 py-1.5 rounded-full whitespace-nowrap transition">D1 (11/26)</button>
                <button @click="currentDay = 'd2'" :class="currentDay === 'd2' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border'" class="px-3 py-1.5 rounded-full whitespace-nowrap transition">D2 (11/27)</button>
                <button @click="currentDay = 'd3'" :class="currentDay === 'd3' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border'" class="px-3 py-1.5 rounded-full whitespace-nowrap transition">D3 (11/28)</button>
                <button @click="currentDay
